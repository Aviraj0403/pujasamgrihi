    <style>
      .initial-spiritual-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 38%, #fff 0 18%, #fff9f0 38%, #f9edbf 100%);
      }

      .initial-spiritual-loader__orbit {
        position: relative;
        width: min(62vw, 280px);
        aspect-ratio: 1;
        border: 1px dashed rgba(139, 30, 30, 0.24);
        border-radius: 50%;
        animation: initial-spiritual-spin 5.5s linear infinite;
      }

      .initial-spiritual-loader__orbit span {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(212, 175, 55, 0.44);
        border-radius: 50%;
        background: rgba(255, 249, 240, 0.9);
        color: #8b1e1e;
        font-size: 20px;
        box-shadow: 0 10px 28px rgba(139, 30, 30, 0.13);
        transform: rotate(var(--angle)) translateX(min(31vw, 140px)) rotate(calc(var(--angle) * -1));
      }

      .initial-spiritual-loader__center {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        width: clamp(96px, 22vw, 132px);
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(212, 175, 55, 0.46);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 50px rgba(74, 32, 11, 0.12);
        transform: translate(-50%, -50%);
      }

      .initial-spiritual-loader__center img {
        width: 72%;
        height: 72%;
        object-fit: contain;
      }

      @keyframes initial-spiritual-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-spiritual-loader" role="status" aria-label="Loading Puja Samagri">
        <div class="initial-spiritual-loader__orbit" aria-hidden="true">
          <span style="--angle: 0deg">ॐ</span>
          <span style="--angle: 72deg">✦</span>
          <span style="--angle: 144deg">◇</span>
          <span style="--angle: 216deg">✺</span>
          <span style="--angle: 288deg">✧</span>
        </div>
        <div class="initial-spiritual-loader__center" aria-hidden="true">
          <img src="/Febiconlogo.webp" alt="Puja Samagri" />
        </div>
      </div>
    </div>

    <!-- React entry point -->
